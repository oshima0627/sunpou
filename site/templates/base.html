<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}

<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/topic-blocks.css">
<link rel="stylesheet" href="/affiliate-banners.css">
<script type="application/ld+json">{{jsonLd}}</script>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="/">{{siteName}}</a>
    <nav class="gnav" aria-label="サイト内メニュー">{{nav}}</nav>
  </div>
</header>

<div class="l-wrap">
  <main class="l-main">
    {{breadcrumb}}
    {{content}}
  </main>

  {{sidebar}}
</div>

<footer class="site-footer">
  <div class="site-footer__inner">
    <nav class="fnav" aria-label="フッターメニュー">{{fnav}}</nav>
    {{sns}}
    {{disclosure}}
    <p class="note">
      掲載している寸法・仕様はメーカー公式サイトの公表値です。計算値は公表寸法から算出したもので、実測値ではありません。
      最新の仕様は各メーカーの公式ページでご確認ください。
    </p>
    <p class="copy">&copy; {{year}} {{siteName}}</p>
  </div>
</footer>

<a class="pagetop" href="#" aria-label="ページの先頭へ戻る" hidden>↑</a>
<!-- ページ先頭へ戻るボタンは、1画面ぶんスクロールするまで出さない。
     ⚠️ 常時表示だと右下44pxが本文に重なる（2026-09-01 のレビューで、モバイルの表と
     本文の上に被っているのを確認した）。読み始めの画面では要らないボタンでもある。 -->
<script>
(function () {
  var b = document.querySelector('.pagetop');
  if (!b) return;
  // ⚠️ **innerHeight を基準にしない。** スクリプトが走る時点では 0 のことがあり
  //（プレビューのブラウザで実際に 0 だった）、`scrollY < innerHeight` が false になって
  // 先頭にいるのにボタンが出た。**画面の高さに依存しない固定値で判定する。**
  var show = function () { b.hidden = scrollY < 600; };
  addEventListener('scroll', show, { passive: true });
  addEventListener('load', show);
  show();
})();
// 横にはみ出している表に「→ 横にスクロール」と出す。
// ⚠️ 早見表はモバイル375pxで幅1303px＝26%しか見えない（2026-09-01 のレビューで実測）。
// 影のグラデーションだけでは、残り74%があることが伝わらない。
// はみ出しているかは実際に測らないと分からないので、CSS では書けない。
(function () {
  var mark = function () {
    document.querySelectorAll('.table-wrap').forEach(function (w) {
      w.classList.toggle('table-wrap--over', w.scrollWidth - w.clientWidth > 8);
    });
  };
  addEventListener('resize', mark);
  mark();
})();
</script>
{{analytics}}
</body>
</html>
