<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="寸法で選ぶ">
  <rect width="64" height="64" rx="10" fill="#014172"/>
  <!-- 寸法線：両端の目盛りと横棒 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="14" y1="18" x2="14" y2="46"/>
    <line x1="50" y1="18" x2="50" y2="46"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
  </g>
  <g fill="#ffffff">
    <polygon points="14,32 24,27 24,37"/>
    <polygon points="50,32 40,27 40,37"/>
  </g>
</svg>
