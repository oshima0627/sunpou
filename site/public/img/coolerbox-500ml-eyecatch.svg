<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="クーラーボックスに500mlは何本入る？ 内寸22×39cmの床面に、胴径68.5mmの丸型ボトルが5列×3行で15本並ぶ図">
  <style>
    .bg   { fill: #fcfcfc; }
    .navy { fill: #014172; }
    .ink  { fill: #434347; }
    .mute { fill: #6f7680; }
    .ttl  { font: 700 60px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .sub  { font: 400 30px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .tag  { font: 700 22px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; letter-spacing:.14em; }
    .note { font: 400 22px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .num  { font: 700 34px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .bottle { fill: #cfe0ef; stroke: #014172; stroke-width: 2; }
    .box    { fill: none; stroke: #014172; stroke-width: 4; }
    .waste  { fill: #e3e7ec; }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect class="navy" x="0" y="0" width="14" height="630"/>

  <!-- 左：テキスト -->
  <text class="tag navy" x="70" y="120">寸法で選ぶ</text>
  <text class="ttl ink"  x="70" y="215">クーラーボックスに</text>
  <text class="ttl ink"  x="70" y="290">500mlは何本入る？</text>
  <text class="sub mute" x="70" y="360">容量Lではなく「内寸」で決まります</text>
  <rect class="navy" x="70" y="400" width="120" height="4"/>
  <text class="note ink" x="70" y="455">同じ20Lでも 15本 と 18本</text>
  <text class="note mute" x="70" y="495">メーカー公表の内寸から計算</text>

  <!-- 右：内寸 22×39cm の床面（10px = 1cm）。丸型68.5mm を格子で並べる -->
  <!-- 余り（捨てられる幅）を先に敷く -->
  <rect class="waste" x="1042.5" y="210" width="47.5" height="220"/>
  <rect class="waste" x="700"    y="415.5" width="342.5" height="14.5"/>

  <rect class="box" x="700" y="210" width="390" height="220"/>

  <g class="bottle">
    <circle cx="734.25" cy="244.25" r="30"/><circle cx="802.75" cy="244.25" r="30"/><circle cx="871.25" cy="244.25" r="30"/><circle cx="939.75" cy="244.25" r="30"/><circle cx="1008.25" cy="244.25" r="30"/>
    <circle cx="734.25" cy="312.75" r="30"/><circle cx="802.75" cy="312.75" r="30"/><circle cx="871.25" cy="312.75" r="30"/><circle cx="939.75" cy="312.75" r="30"/><circle cx="1008.25" cy="312.75" r="30"/>
    <circle cx="734.25" cy="381.25" r="30"/><circle cx="802.75" cy="381.25" r="30"/><circle cx="871.25" cy="381.25" r="30"/><circle cx="939.75" cy="381.25" r="30"/><circle cx="1008.25" cy="381.25" r="30"/>
  </g>

  <text class="note mute" x="700" y="195">内寸 22 × 39cm ／ 丸型 68.5φ</text>
  <text class="num navy"  x="700" y="480">5列 × 3行 ＝ 15本</text>
  <text class="note mute" x="700" y="515">灰色は割り切れずに捨てられる余り</text>
</svg>
