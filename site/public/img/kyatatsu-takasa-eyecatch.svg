<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="型番に180が付く脚立4シリーズの天板の高さの比較。アルインコBSA-180AとピカSEC-S180は1.80メートル、長谷川工業RHB-18aは1.70メートル、ピカMCX-180は1.68メートル。RHB-18aで足を置ける使用最大高さは1.40メートル">
  <style>
    .bg   { fill: #fcfcfc; }
    .ink  { fill: #434347; }
    .mute { fill: #6f7680; }
    .navy { fill: #014172; }
    .rust { fill: #a8410f; }
    .t    { font: 700 44px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .st   { font: 400 22px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .nm   { font: 700 20px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .sub  { font: 400 15px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .val  { font: 700 24px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .barN { fill: #cfe0ef; stroke: #014172; stroke-width: 2; }
    .barR { fill: #f3d2be; stroke: #a8410f; stroke-width: 2; }
    .rule { stroke: #a8410f; stroke-width: 3; stroke-dasharray: 8 6; }
    .div  { stroke: #d7dbe0; stroke-width: 2; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <text class="t ink"   x="80" y="84">同じ「180」でも、天板の高さが違います</text>
  <text class="st mute" x="80" y="126">型番に180が付く4シリーズのメーカー公表値。目盛りは 1cm = 2.6px</text>

  <line class="rule" x1="828" y1="170" x2="828" y2="470"/>

  <rect class="barN" x="360" y="186" width="468" height="40"/>
  <text class="nm ink"   x="80" y="206">アルインコ BSA-180A</text>
  <text class="sub mute" x="80" y="230">専用脚立</text>
  <text class="val navy" x="846" y="215">1.80m</text>

  <rect class="barN" x="360" y="262" width="468" height="40"/>
  <text class="nm ink"   x="80" y="282">ピカ SEC-S180</text>
  <text class="sub mute" x="80" y="306">専用脚立</text>
  <text class="val navy" x="846" y="291">1.80m</text>

  <rect class="barN" x="360" y="338" width="442" height="40"/>
  <text class="nm ink"   x="80" y="358">長谷川工業 RHB-18a</text>
  <text class="sub mute" x="80" y="382">はしご兼用脚立</text>
  <text class="val navy" x="820" y="367">1.70m</text>

  <rect class="barN" x="360" y="414" width="437" height="40"/>
  <text class="nm ink"   x="80" y="434">ピカ MCX-180</text>
  <text class="sub mute" x="80" y="458">はしご兼用脚立</text>
  <text class="val navy" x="815" y="443">1.68m</text>

  <line class="div" x1="80" y1="486" x2="1120" y2="486"/>

  <rect class="barR" x="360" y="505" width="364" height="40"/>
  <text class="nm rust"  x="80" y="525">RHB-18a に立てる高さ</text>
  <text class="sub mute" x="80" y="549">天板には乗れません</text>
  <text class="val rust" x="742" y="534">1.40m</text>

  <text class="st mute" x="80" y="600">専用脚立は型番＝天板高さ。はしご兼用脚立は型番より9〜12cm低い値でした。</text>
</svg>
