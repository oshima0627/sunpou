<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img"
     aria-label="同じ15Lのクーラーボックスを上から見た図。アイリスオーヤマHUGEL15Lは外寸45.0かける30.8センチで内寸30.2かける18.2センチ、ダイワS1500は外寸47.5かける25.0センチで内寸36.0かける17.0センチ">
  <style>
    .bg     { fill: #fcfcfc; }
    .ink    { fill: #434347; }
    .mute   { fill: #6f7680; }
    .navy   { fill: #014172; }
    .h      { font: 700 20px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .s      { font: 400 15px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .n      { font: 700 22px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .outer  { fill: #e3e7ec; stroke: #9aa3ad; stroke-width: 2; }
    .inner  { fill: #cfe0ef; stroke: #014172; stroke-width: 3; }
  </style>

  <rect class="bg" width="900" height="480"/>

  <text class="h ink"  x="30" y="38">どちらも15L。外寸のほうが小さいほうが、中は広い</text>
  <text class="s mute" x="30" y="64">上から見た床面 ／ 縮尺 8px = 1cm ／ 灰色の外枠＝外寸、青い内枠＝内寸（いずれもメーカー公表値）</text>

  <text class="s ink" x="30" y="100">アイリスオーヤマ HUGEL 15L（真空断熱パネル）</text>
  <rect class="outer" x="30" y="120" width="360" height="246"/>
  <rect class="inner" x="89" y="170" width="242" height="146"/>
  <text class="n navy" x="30" y="404">外寸 45.0 × 30.8cm　→　内寸 30.2 × 18.2cm</text>
  <text class="s mute" x="30" y="432">外寸と内寸の差は 長辺で片側7.4cm ／ 短辺で片側6.3cm</text>

  <text class="s ink" x="470" y="100">ダイワ クールラインα3 S1500（発泡スチロール）</text>
  <rect class="outer" x="470" y="120" width="380" height="200"/>
  <rect class="inner" x="516" y="152" width="288" height="136"/>
  <text class="n navy" x="470" y="404">外寸 47.5 × 25.0cm　→　内寸 36.0 × 17.0cm</text>
  <text class="s mute" x="470" y="432">外寸と内寸の差は 長辺で片側5.75cm ／ 短辺で片側4.0cm</text>
</svg>
