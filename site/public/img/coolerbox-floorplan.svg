<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img"
     aria-label="床面積が同じ858平方センチでも入る本数は違う。内寸22×39cmは丸型ボトルが5列3行で15本、内寸33×26cmは4列3行で12本になる図">
  <style>
    .bg     { fill: #fcfcfc; }
    .ink    { fill: #434347; }
    .mute   { fill: #6f7680; }
    .navy   { fill: #014172; }
    .h      { font: 700 20px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .s      { font: 400 15px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .n      { font: 700 26px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .bottle { fill: #cfe0ef; stroke: #014172; stroke-width: 1.5; }
    .box    { fill: none; stroke: #014172; stroke-width: 3; }
    .waste  { fill: #e3e7ec; }
  </style>

  <rect class="bg" width="900" height="480"/>

  <text class="h ink"  x="30" y="38">床面積は同じ 858cm² — それでも本数は違う</text>
  <text class="s mute" x="30" y="64">縮尺 10px = 1cm ／ 丸型ボトル 胴径 68.5mm ／ 灰色は割り切れずに捨てられる余り</text>

  <!-- 左：22 × 39cm → 5列 × 3行 = 15本 -->
  <text class="s ink" x="30" y="105">ダイワ S2000（20L）　内寸 22 × 39cm</text>
  <rect class="waste" x="372.5" y="120" width="47.5" height="220"/>
  <rect class="waste" x="30"    y="325.5" width="342.5" height="14.5"/>
  <rect class="box"   x="30" y="120" width="390" height="220"/>
  <g class="bottle">
    <circle cx="64.25" cy="154.25" r="30"/><circle cx="132.75" cy="154.25" r="30"/><circle cx="201.25" cy="154.25" r="30"/><circle cx="269.75" cy="154.25" r="30"/><circle cx="338.25" cy="154.25" r="30"/>
    <circle cx="64.25" cy="222.75" r="30"/><circle cx="132.75" cy="222.75" r="30"/><circle cx="201.25" cy="222.75" r="30"/><circle cx="269.75" cy="222.75" r="30"/><circle cx="338.25" cy="222.75" r="30"/>
    <circle cx="64.25" cy="291.25" r="30"/><circle cx="132.75" cy="291.25" r="30"/><circle cx="201.25" cy="291.25" r="30"/><circle cx="269.75" cy="291.25" r="30"/><circle cx="338.25" cy="291.25" r="30"/>
  </g>
  <text class="n navy" x="30" y="385">5列 × 3行 ＝ 15本</text>
  <text class="s mute" x="30" y="412">39 ÷ 6.85 ＝ 5.7 → 5列　／　22 ÷ 6.85 ＝ 3.2 → 3行</text>

  <!-- 右：33 × 26cm → 4列 × 3行 = 12本 -->
  <text class="s ink" x="500" y="105">ロゴス ハイパー氷点下クーラーL（20L）　内寸 33 × 26cm</text>
  <rect class="waste" x="774" y="120" width="56" height="260"/>
  <rect class="waste" x="500" y="325.5" width="274" height="54.5"/>
  <rect class="box"   x="500" y="120" width="330" height="260"/>
  <g class="bottle">
    <circle cx="534.25" cy="154.25" r="30"/><circle cx="602.75" cy="154.25" r="30"/><circle cx="671.25" cy="154.25" r="30"/><circle cx="739.75" cy="154.25" r="30"/>
    <circle cx="534.25" cy="222.75" r="30"/><circle cx="602.75" cy="222.75" r="30"/><circle cx="671.25" cy="222.75" r="30"/><circle cx="739.75" cy="222.75" r="30"/>
    <circle cx="534.25" cy="291.25" r="30"/><circle cx="602.75" cy="291.25" r="30"/><circle cx="671.25" cy="291.25" r="30"/><circle cx="739.75" cy="291.25" r="30"/>
  </g>
  <text class="n navy" x="500" y="425">4列 × 3行 ＝ 12本</text>
  <text class="s mute" x="500" y="452">33 ÷ 6.85 ＝ 4.8 → 4列　／　26 ÷ 6.85 ＝ 3.8 → 3行</text>
</svg>
