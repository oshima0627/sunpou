<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img"
     aria-label="大型ペットボトルの全高とクーラーボックスの内寸の深さを比べた図。1.5Lは305〜307.5mmで2Lの305〜306mmとほぼ同じ高さ。深さ255mm以下のクーラーボックスにはどちらも立たない">
  <style>
    .bg   { fill: #fcfcfc; }
    .ink  { fill: #434347; }
    .mute { fill: #6f7680; }
    .navy { fill: #014172; }
    .h    { font: 700 19px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .s    { font: 400 14px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .lbl  { font: 400 12px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .ax   { font: 400 11px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; fill: #8b939c; }
    .val  { font: 700 12px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .dep  { font: 700 12px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; fill: #b5561e; }
    .bar  { fill: #cfe0ef; stroke: #014172; stroke-width: 1.5; }
    .bar2 { fill: #9dc2e0; stroke: #014172; stroke-width: 1.5; }
    .line { stroke: #b5561e; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .grid { stroke: #e0e4e9; stroke-width: 1; }
  </style>

  <rect class="bg" width="900" height="530"/>

  <text class="h ink"  x="30" y="34">大型ペットボトルの全高 と クーラーボックスの深さ</text>
  <text class="s mute" x="30" y="58">棒がボトルの全高、破線がクーラーボックスの内寸の深さ。破線より高い棒は立たない。</text>

  <!-- 目盛り（y = 420 −(mm−200)×3） -->
  <line class="grid" x1="62" y1="420" x2="640" y2="420"/>
  <line class="grid" x1="62" y1="270" x2="640" y2="270"/>
  <line class="grid" x1="62" y1="120" x2="640" y2="120"/>
  <text class="ax" x="18" y="424">200mm</text>
  <text class="ax" x="18" y="274">250mm</text>
  <text class="ax" x="18" y="124">300mm</text>

  <!-- クーラーボックスの内寸の深さ（破線）。240mm と 243mm は近接するのでまとめて1本にしている -->
  <line class="line" x1="62" y1="360" x2="640" y2="360"/>
  <text class="dep" x="648" y="356">220mm ダイワ10L・20L</text>
  <line class="line" x1="62" y1="330" x2="640" y2="330"/>
  <text class="dep" x="648" y="326">230mm ダイワ15L</text>
  <line class="line" x1="62" y1="300" x2="640" y2="300"/>
  <line class="line" x1="62" y1="291" x2="640" y2="291"/>
  <text class="dep" x="648" y="292">240・243mm ロゴス・アイリス</text>
  <line class="line" x1="62" y1="255" x2="640" y2="255"/>
  <text class="dep" x="648" y="251">255mm ダイワ25L</text>
  <line class="line" x1="62" y1="90" x2="640" y2="90"/>
  <text class="dep" x="648" y="86">310mm アイリス40L</text>

  <!-- ボトル（棒）。中心 x = 96, 169, 241, 314, 386, 459, 531, 604 -->
  <g class="bar">
    <rect x="73"  y="348"   width="46" height="72"/>
    <rect x="146" y="276"   width="46" height="144"/>
    <rect x="218" y="270"   width="46" height="150"/>
    <rect x="291" y="238.2" width="46" height="181.8"/>
  </g>
  <g class="bar2">
    <rect x="363" y="105"  width="46" height="315"/>
    <rect x="436" y="97.5" width="46" height="322.5"/>
    <rect x="508" y="105"  width="46" height="315"/>
    <rect x="581" y="102"  width="46" height="318"/>
  </g>

  <g class="val navy" text-anchor="middle">
    <text x="96"  y="342">224</text>
    <text x="169" y="270">248</text>
    <text x="241" y="264">250</text>
    <text x="314" y="232">260.6</text>
    <text x="386" y="99">305</text>
    <text x="459" y="91.5">307.5</text>
    <text x="531" y="99">305</text>
    <text x="604" y="96">306</text>
  </g>

  <g class="lbl ink" text-anchor="middle">
    <text x="96"  y="440">1L角リブ</text>
    <text x="169" y="440">1L長角</text>
    <text x="241" y="440">1L平角</text>
    <text x="314" y="440">1L炭酸</text>
    <text x="386" y="440">1.5L炭酸</text>
    <text x="459" y="440">1.5L角</text>
    <text x="531" y="440">2L角(B)</text>
    <text x="604" y="440">2L角(A)</text>
  </g>

  <text class="s ink"  x="30" y="486">★ 1.5L（305〜307.5mm）は 2L（305〜306mm）とほぼ同じ高さ。「1.5Lなら入る」は成り立たない。</text>
  <text class="s mute" x="30" y="510">出典：ボトル＝料材開発「飲料用ボトル 1L〜」／深さ＝各メーカー公式の内寸</text>
</svg>
