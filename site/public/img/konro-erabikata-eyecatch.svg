<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="「9号土鍋まで」を名乗るイワタニ9機種の本体幅の比較。スリムは32.8cm、スマートとウィンドシールドは33.4cm、達人スリムVと達人スリムβは33.5cm、BOは33.7cm、アモルフォプレミアムは35.5cm、雅SLIMは35.85cm、極は39.1cm。9号土鍋でいちばん幅のある墨貫入は32.5cmで、スリムとの差は0.3cmしかない">
  <style>
    .bg   { fill: #fcfcfc; }
    .ink  { fill: #434347; }
    .mute { fill: #6f7680; }
    .navy { fill: #014172; }
    .rust { fill: #a8410f; }
    .t    { font: 700 40px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .st   { font: 400 21px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .nm   { font: 700 19px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .val  { font: 700 22px "Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif; }
    .bar  { fill: #cfe0ef; stroke: #014172; stroke-width: 2; }
    .nabe { fill: none; stroke: #a8410f; stroke-width: 3; stroke-dasharray: 7 5; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <text class="t ink"   x="60" y="70">同じ「9号まで」でも、幅は32.8〜39.1cm</text>
  <text class="st mute" x="60" y="110">横棒はカセットコンロの本体幅。破線は9号土鍋でいちばん幅のある墨貫入（32.5cm）</text>
  <text class="st rust" x="60" y="142">スリムは土鍋との差が0.3cm。極は6.6cm。目盛りは 1cm = 18px</text>

  <line class="nabe" x1="935" y1="176" x2="935" y2="574"/>
  <text class="nm rust" x="835" y="600">9号土鍋 32.5cm</text>

  <rect class="bar" x="350" y="182" width="590" height="42"/>
  <text class="nm ink"  x="60"  y="209">スリム</text>
  <text class="val navy" x="952" y="211">32.8cm</text>

  <rect class="bar" x="350" y="238" width="601" height="42"/>
  <text class="nm ink"  x="60"  y="265">スマート／ウィンドシールド</text>
  <text class="val navy" x="963" y="267">33.4cm</text>

  <rect class="bar" x="350" y="294" width="603" height="42"/>
  <text class="nm ink"  x="60"  y="321">達人スリムV／達人スリムβ</text>
  <text class="val navy" x="965" y="323">33.5cm</text>

  <rect class="bar" x="350" y="350" width="607" height="42"/>
  <text class="nm ink"  x="60"  y="377">BO—</text>
  <text class="val navy" x="969" y="379">33.7cm</text>

  <rect class="bar" x="350" y="406" width="639" height="42"/>
  <text class="nm ink"  x="60"  y="433">アモルフォ プレミアム</text>
  <text class="val navy" x="1001" y="435">35.5cm</text>

  <rect class="bar" x="350" y="462" width="645" height="42"/>
  <text class="nm ink"  x="60"  y="489">雅SLIM</text>
  <text class="val navy" x="1007" y="491">35.85cm</text>

  <rect class="bar" x="350" y="518" width="704" height="42"/>
  <text class="nm ink"  x="60"  y="545">極</text>
  <text class="val navy" x="1066" y="547">39.1cm</text>
</svg>
